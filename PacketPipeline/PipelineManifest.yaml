Name: EnrichmentPipeline

ConfigRegistry:
  Repo: foundry-platform/registries/config-registry
  Ref: main #non optional!

Kafkas:
  Input: #mandatory
    Config: kafka/prod
    AllowedTypes: [XmlPackets]
    Topic: raw.xml

  ConvertedPackets:
    Config: kafka/prod
    AllowedTypes: [Packets]
    Topic: enrichment.packets

  Enrichments:
    Config: kafka/prod
    AllowedTypes: [DecodeEnrichment, IspEnrichment]
    Topic: packets.enrichments

  Output: #mandatory
    Config: kafka/prod
    AllowedTypes: [EnrichedPackets]
    Topic: packets.enriched

Operators:
  XmlToJsonConverter:
    Repo: foundry-platform/example-operators/xml-parser
    Ref: main

  Decoder:
    Repo: foundry-platform/example-operators/decoder
    Ref: main

  IspEnricher:
    Repo: foundry-platform/example-operators/isp-enricher
    Ref: main

  Joiner:
    Repo: foundry-platform/example-operators/packet-joiner
    Ref: main

Flow:
    - Input -> XmlToJsonConverter
    - XmlToJsonConverter -> ConvertedPackets

    - ConvertedPackets -> Decoder
    - ConvertedPackets -> IspEnricher

    - Decoder -> Enrichments
    - IspEnricher -> Enrichments

    - ConvertedPackets -> Joiner
    - Enrichments -> Joiner
    - Joiner -> Output
