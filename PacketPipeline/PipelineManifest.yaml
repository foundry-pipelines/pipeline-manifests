Name: EnrichmentPipeline

ConfigRegistry:
  Repo: foundry-platform/common/configRegistry
  Ref: main #non optional!

Kafkas:
  Input: #mandatory
    Config: kafka/prod
    AllowedTypes: [XmlPackets]
    Topic: raw.xml

  ConvertedPackets:
    Config: kafka/prod
    AllowedTypes: [Packets]
    Topic: enrichment.packets

  Enrichments:
    Config: kafka/prod
    AllowedTypes: [DecodeEnrichment, IspEnrichment]
    Topic: packets.enrichments

  Output: #mandatory
    Config: kafka/prod
    AllowedTypes: [EnrichedPackets]
    Topic: packets.enriched

Processors:
  XmlToJsonConverter:
    Repo: foundry-platform/operators/xmltojsonprocessor
    Ref: main

  Decoder:
    Repo: foundry-platform/operators/decodingprocessor
    Ref: main

  IspEnricher:
    Repo: foundry-platform/operators/IspEnricher
    Ref: main

  Joiner:
    Repo: foundry-platform/operators/packetjoiner
    Ref: main

Flow:
    - Input -> XmlToJsonConverter
    - XmlToJsonConverter -> ConvertedPackets

    - ConvertedPackets -> Decoder
    - ConvertedPackets -> IspEnricher

    - Decoder -> Enrichments
    - IspEnricher -> Enrichments

    - ConvertedPackets -> Joiner
    - Enrichments -> Joiner
    - Joiner -> Output
