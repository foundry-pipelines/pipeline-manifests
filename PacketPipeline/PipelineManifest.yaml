# yaml-language-server: $schema=https://gitlab.com/foundry-platform/common/scripts/-/jobs/artifacts/main/raw/manifest.schema.json?job=schema
Name: EnrichmentPipeline

ConfigRegistry:
  Repo: https://gitlab.com/foundry-platform/common/configRegistry.git
  Ref: main #non optional!

Kafkas:
  Input: #mandatory
    Config: kafka/prod
    AllowedTypes: [XmlPackets]
    Topic: raw.xml

  ConvertedPackets:
    Config: kafka/prod
    AllowedTypes: [Packets]
    Topic: enrichment.packets

  Enrichments:
    Config: kafka/prod
    AllowedTypes: [DecodeEnrichment, IspEnrichment]
    Topic: packets.enrichments

  Output: #mandatory
    Config: kafka/prod
    AllowedTypes: [EnrichedPackets]
    Topic: packets.enriched

Processors:
  XmlToJsonConverter:
    Repo: https://gitlab.com/foundry-platform/operators/xmltojsonprocessor.git
    Ref: main

  Decoder:
    Repo: https://gitlab.com/foundry-platform/operators/decodingprocessor.git
    Ref: main

  IspEnricher:
    Repo: https://gitlab.com/foundry-platform/operators/IspEnricher.git
    Ref: main

  Joiner:
    Repo: https://gitlab.com/foundry-platform/operators/packetjoiner.git
    Ref: main

Flow:
    - Input -> XmlToJsonConverter
    - XmlToJsonConverter -> ConvertedPackets

    - ConvertedPackets -> Decoder
    - ConvertedPackets -> IspEnricher

    - Decoder -> Enrichments
    - IspEnricher -> Enrichments

    - ConvertedPackets -> Joiner
    - Enrichments -> Joiner
    - Joiner -> Output
