# yaml-language-server: $schema=https://gitlab.com/foundry-platform/common/scripts/-/jobs/artifacts/main/raw/manifest.schema.json?job=schema
Name: EnrichmentPipeline

Configs:
  Repo: https://gitlab.com/foundry-platform/common/configs.git
  # Ref: v1   # optional, defaults to main

# DataSchema names a schema in the Configs repo's schemas/ (types in the Foundry.Common.Models package).
DataSets:
  Input:
    Type: Kafka
    Config: kafka/prod
    DataSchema: XmlPackets
    Topic: raw.xml

  ConvertedPackets:
    Type: Kafka
    Config: kafka/prod
    DataSchema: Packets
    Topic: enrichment.packets

  # Decode and Isp each write their enrichment of a packet here, keyed by its guid.
  Enrichments:
    Type: Kafka
    Config: kafka/prod
    DataSchema: [DecodeEnrichment, IspEnrichment]
    Topic: packets.enrichments

  Output:
    Type: Kafka
    Config: kafka/prod
    DataSchema: EnrichedPackets
    Topic: packets.enriched

Processors:
  XmlToJson:
    Repo: https://gitlab.com/foundry-platform/enrichers/xmltojsonprocessor.git
    In: Input
    Out: ConvertedPackets

  Decode:
    Repo: https://gitlab.com/foundry-platform/enrichers/decodingprocessor.git
    In: ConvertedPackets
    Out: Enrichments

  Isp:
    Repo: https://gitlab.com/foundry-platform/enrichers/IspEnricher.git
    In: ConvertedPackets
    Out: Enrichments

  # Puts each packet together with its enrichments (stateful, windowed).
  Join:
    Repo: https://gitlab.com/foundry-platform/enrichers/packetjoiner.git
    Runtime: flink
    In: [ConvertedPackets, Enrichments]
    Out: Output
