# Renders every pipeline folder's manifest to Kubernetes YAML (manifest.py k8s) and, on main, applies it
# to the cluster (scripts/deploy/deploy.sh). Also triggered by configs changes and processor image builds.
stages: [render, deploy]

render:
  stage: render
  image: python:3.12
  script:
    - pip install --quiet pyyaml
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - for m in */PipelineManifest.yaml; do python /tmp/scripts/manifest/manifest.py k8s "$m" -o "out/$(dirname "$m")"; done
  artifacts:
    paths: [out/]

deploy:
  stage: deploy
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: deploy  # one deploy at a time
  variables:
    KUBE_SERVER: https://haltura.me/k8s/clusters/local  # Rancher's proxy; KUBE_TOKEN is a Rancher API token
  script:
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x /usr/local/bin/kubectl
    - kubectl config set-cluster foundry --server="$KUBE_SERVER" && kubectl config set-credentials ci --token="$KUBE_TOKEN"
    - kubectl config set-context foundry --cluster=foundry --user=ci && kubectl config use-context foundry
    - git clone --quiet --depth 1 https://gitlab.com/foundry-platform/common/scripts.git /tmp/scripts
    - /tmp/scripts/deploy/deploy.sh out/*/
